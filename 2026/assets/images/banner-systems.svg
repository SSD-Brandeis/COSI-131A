<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 670" width="1920" height="670">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2f63"/>
      <stop offset="50%" stop-color="#163d80"/>
      <stop offset="100%" stop-color="#0a2454"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9f8ff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="traceFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123059"/>
      <stop offset="100%" stop-color="#0a1e40"/>
    </linearGradient>
    <linearGradient id="towerFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c3f75"/>
      <stop offset="100%" stop-color="#0c2148"/>
    </linearGradient>

    <filter id="wideBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>

    <g id="badge">
      <circle r="34" fill="#0a1e40" stroke="#7dd3fc" stroke-width="1.6"/>
      <circle r="34" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.35"/>
    </g>
    <!-- icon glyphs, each ~34x34 centered at origin -->
    <g id="icon-gear" stroke="#a5f3fc" stroke-width="2.4" fill="none" stroke-linecap="round">
      <circle r="9"/>
      <path d="M0,-16 V-10 M0,10 V16 M-16,0 H-10 M10,0 H16 M-11,-11 L-7,-7 M7,7 L11,11 M-11,11 L-7,7 M7,-7 L11,-11"/>
    </g>
    <g id="icon-cpu" stroke="#a5f3fc" stroke-width="2.2" fill="none" stroke-linecap="round">
      <rect x="-11" y="-11" width="22" height="22" rx="2"/>
      <rect x="-4" y="-4" width="8" height="8" fill="#a5f3fc" stroke="none"/>
      <path d="M0,-11 V-17 M0,11 V17 M-11,0 H-17 M11,0 H17 M-6,-11 V-17 M6,-11 V-17 M-6,11 V17 M6,11 V17"/>
    </g>
    <g id="icon-grid" stroke="#a5f3fc" stroke-width="2" fill="none">
      <rect x="-13" y="-13" width="11" height="11" rx="1.5"/>
      <rect x="2" y="-13" width="11" height="11" rx="1.5"/>
      <rect x="-13" y="2" width="11" height="11" rx="1.5" fill="#a5f3fc" stroke="none"/>
      <rect x="2" y="2" width="11" height="11" rx="1.5"/>
    </g>
    <g id="icon-lock" stroke="#a5f3fc" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-11" y="-3" width="22" height="18" rx="3"/>
      <path d="M-7,-3 V-9 a7,7 0 0 1 14,0 V-3"/>
      <circle cx="0" cy="6" r="2.4" fill="#a5f3fc" stroke="none"/>
    </g>
    <g id="icon-disk" stroke="#a5f3fc" stroke-width="2.1" fill="none">
      <ellipse cx="0" cy="9" rx="15" ry="5"/>
      <ellipse cx="0" cy="0" rx="15" ry="5"/>
      <ellipse cx="0" cy="-9" rx="15" ry="5"/>
      <path d="M-15,-9 V9 M15,-9 V9"/>
    </g>
    <g id="icon-terminal" stroke="#a5f3fc" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-15" y="-11" width="30" height="22" rx="2.5"/>
      <path d="M-9,-3 L-3,2 L-9,7 M0,7 H8"/>
    </g>
    <g id="icon-layers" stroke="#a5f3fc" stroke-width="2.1" fill="none" stroke-linejoin="round">
      <path d="M0,-13 L15,-4 L0,5 L-15,-4 Z"/>
      <path d="M-15,3 L0,12 L15,3" stroke-opacity="0.85"/>
      <path d="M-15,10 L0,19 L15,10" stroke-opacity="0.6"/>
    </g>
    <g id="icon-clock" stroke="#a5f3fc" stroke-width="2.2" fill="none" stroke-linecap="round">
      <circle r="15"/>
      <path d="M0,-9 V0 L7,5"/>
    </g>

    <g id="dashRing">
      <circle r="1" fill="none"/>
    </g>
  </defs>

  <rect width="1920" height="670" fill="url(#bgGrad)"/>

  <!-- ambient glows -->
  <ellipse cx="960" cy="330" rx="520" ry="360" fill="url(#cyanGlow)"/>
  <ellipse cx="960" cy="330" rx="330" ry="330" fill="url(#magentaGlow)" opacity="0.6"/>
  <ellipse cx="200" cy="360" rx="360" ry="320" fill="url(#goldGlow)" opacity="0.55"/>
  <ellipse cx="1720" cy="330" rx="360" ry="330" fill="url(#cyanGlow)" opacity="0.45"/>

  <!-- sweeping trails -->
  <g filter="url(#wideBlur)" opacity="0.75">
    <path d="M -80 110 C 380 30, 700 230, 1180 80 S 1760 230, 2000 120" stroke="url(#traceFade)" stroke-width="6" fill="none"/>
    <path d="M -80 600 C 420 670, 760 480, 1220 600 S 1700 470, 2000 550" stroke="url(#traceFade)" stroke-width="6" fill="none"/>
  </g>

  <!-- ===== LEFT: motherboard panel ===== -->
  <g opacity="0.95">
    <rect x="0" y="70" width="600" height="530" rx="14" fill="url(#boardFill)"/>
    <rect x="0" y="70" width="600" height="530" rx="14" fill="none" stroke="#2c5590" stroke-width="1.5"/>
    <g stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.6" fill="none">
      <path d="M40 140 H220 V180 H320 M320 180 V240 H460"/>
      <path d="M40 470 H160 V520 H280 M280 520 V560 H420"/>
      <path d="M40 300 H140"/>
      <path d="M460 400 H540 V340 H580"/>
    </g>
    <g fill="#fbbf24" opacity="0.85">
      <circle cx="220" cy="140" r="2.4"/><circle cx="320" cy="180" r="2.4"/><circle cx="460" cy="240" r="2.4"/>
      <circle cx="160" cy="470" r="2.4"/><circle cx="280" cy="520" r="2.4"/><circle cx="420" cy="560" r="2.4"/>
    </g>
    <!-- CPU socket -->
    <rect x="90" y="200" width="120" height="120" rx="6" fill="#0a1830" stroke="#7dd3fc" stroke-width="1.6"/>
    <rect x="112" y="222" width="76" height="76" rx="3" fill="#123059" stroke="#7dd3fc" stroke-width="1"/>
    <g fill="#7dd3fc" opacity="0.7">
      <circle cx="122" cy="232" r="1.6"/><circle cx="140" cy="232" r="1.6"/><circle cx="158" cy="232" r="1.6"/><circle cx="176" cy="232" r="1.6"/>
      <circle cx="122" cy="250" r="1.6"/><circle cx="176" cy="250" r="1.6"/>
      <circle cx="122" cy="268" r="1.6"/><circle cx="176" cy="268" r="1.6"/>
      <circle cx="122" cy="286" r="1.6"/><circle cx="140" cy="286" r="1.6"/><circle cx="158" cy="286" r="1.6"/><circle cx="176" cy="286" r="1.6"/>
    </g>
    <!-- ram slots -->
    <g fill="#0a1830" stroke="#4b7cb8" stroke-width="1.3">
      <rect x="260" y="380" width="14" height="130" rx="2"/>
      <rect x="284" y="380" width="14" height="130" rx="2"/>
      <rect x="308" y="380" width="14" height="130" rx="2"/>
      <rect x="332" y="380" width="14" height="130" rx="2"/>
    </g>
    <g fill="#67e8f9" opacity="0.8">
      <rect x="263" y="495" width="8" height="10"/><rect x="287" y="495" width="8" height="10"/>
      <rect x="311" y="495" width="8" height="10" fill="#fbbf24"/><rect x="335" y="495" width="8" height="10"/>
    </g>
    <rect x="430" y="120" width="130" height="46" rx="4" fill="#0a1830" stroke="#4b7cb8" stroke-width="1.2"/>
    <g fill="#67e8f9" opacity="0.6"><rect x="442" y="132" width="10" height="10"/><rect x="458" y="132" width="10" height="10"/><rect x="474" y="132" width="10" height="10"/><rect x="442" y="148" width="10" height="10"/><rect x="458" y="148" width="10" height="10" fill="#fbbf24"/><rect x="474" y="148" width="10" height="10"/></g>
    <rect x="430" y="440" width="150" height="60" rx="4" fill="#0a1830" stroke="#4b7cb8" stroke-width="1.2"/>
    <g stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.4" fill="none"><path d="M444 486 H480 V460 H520 V478 H556"/></g>
    <g fill="#fbbf24" opacity="0.8"><circle cx="480" cy="460" r="2"/><circle cx="520" cy="478" r="2"/></g>
  </g>
  <rect x="480" y="70" width="120" height="530" fill="url(#bgGrad)" opacity="0.9" filter="url(#wideBlur)"/>

  <!-- ===== RIGHT: layered skyline ===== -->
  <g>
    <g id="towerBands" opacity="0.95">
      <rect x="1440" y="470" width="60" height="130" fill="url(#towerFill)" stroke="#2c5590" stroke-width="1"/>
      <rect x="1510" y="380" width="60" height="220" fill="url(#towerFill)" stroke="#2c5590" stroke-width="1"/>
      <rect x="1580" y="300" width="60" height="300" fill="url(#towerFill)" stroke="#2c5590" stroke-width="1"/>
      <rect x="1650" y="420" width="60" height="180" fill="url(#towerFill)" stroke="#2c5590" stroke-width="1"/>
      <rect x="1720" y="480" width="60" height="120" fill="url(#towerFill)" stroke="#2c5590" stroke-width="1"/>
      <rect x="1790" y="440" width="60" height="160" fill="url(#towerFill)" stroke="#2c5590" stroke-width="1"/>
      <!-- layer band lines: hardware(gold) / kernel(cyan) / process(violet) bands, thirds of each tower -->
      <g stroke-width="1.6" opacity="0.85">
        <path d="M1440,556.7 H1500" stroke="#fbbf24"/><path d="M1440,513.3 H1500" stroke="#67e8f9"/><path d="M1440,470 H1500" stroke="#c084fc"/>
        <path d="M1510,486.7 H1570" stroke="#fbbf24"/><path d="M1510,433.3 H1570" stroke="#67e8f9"/><path d="M1510,380 H1570" stroke="#c084fc"/>
        <path d="M1580,433.3 H1640" stroke="#fbbf24"/><path d="M1580,366.7 H1640" stroke="#67e8f9"/><path d="M1580,300 H1640" stroke="#c084fc"/>
        <path d="M1650,500 H1710" stroke="#fbbf24"/><path d="M1650,460 H1710" stroke="#67e8f9"/><path d="M1650,420 H1710" stroke="#c084fc"/>
        <path d="M1720,540 H1780" stroke="#fbbf24"/><path d="M1720,510 H1780" stroke="#67e8f9"/><path d="M1720,480 H1780" stroke="#c084fc"/>
        <path d="M1790,493.3 H1850" stroke="#fbbf24"/><path d="M1790,466.7 H1850" stroke="#67e8f9"/><path d="M1790,440 H1850" stroke="#c084fc"/>
      </g>
      <rect x="1440" y="470" width="60" height="6" fill="#fbbf24" opacity="0.85"/>
      <rect x="1510" y="380" width="60" height="6" fill="#67e8f9" opacity="0.85"/>
      <rect x="1580" y="300" width="60" height="6" fill="#c084fc" opacity="0.85"/>
      <rect x="1650" y="420" width="60" height="6" fill="#67e8f9" opacity="0.85"/>
      <rect x="1720" y="480" width="60" height="6" fill="#fbbf24" opacity="0.85"/>
      <rect x="1790" y="440" width="60" height="6" fill="#c084fc" opacity="0.85"/>
      <g fill="#7dd3fc" opacity="0.55">
        <circle cx="1470" cy="510" r="2"/><circle cx="1540" cy="430" r="2"/><circle cx="1610" cy="350" r="2"/>
        <circle cx="1680" cy="460" r="2"/><circle cx="1750" cy="520" r="2"/><circle cx="1820" cy="480" r="2"/>
        <circle cx="1470" cy="550" r="2"/><circle cx="1610" cy="400" r="2"/><circle cx="1820" cy="530" r="2"/>
      </g>
    </g>
  </g>

  <!-- connector conduits from hub to side elements -->
  <g fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.55">
    <path d="M700,330 C 640,330 600,300 600,260"/>
    <path d="M1220,330 C 1300,330 1360,360 1420,420"/>
  </g>
  <g fill="#7dd3fc" opacity="0.85"><circle cx="600" cy="260" r="3.2"/><circle cx="1420" cy="420" r="3.2"/></g>

  <!-- ===== CENTER: glowing hub with OS concept badges ===== -->
  <g transform="translate(960,330)">
    <ellipse rx="300" ry="300" fill="url(#coreGlow)" opacity="0.5"/>

    <!-- concentric HUD rings -->
    <circle r="230" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.75"/>
    <circle r="230" fill="none" stroke="#f472b6" stroke-width="8" opacity="0.18"/>
    <circle r="190" fill="none" stroke="#22d3ee" stroke-width="2.4" opacity="0.85"/>
    <circle r="150" fill="none" stroke="#a5f3fc" stroke-width="1.4" stroke-dasharray="2 6" opacity="0.7"/>
    <circle r="112" fill="none" stroke="#a5f3fc" stroke-width="1" opacity="0.4"/>

    <!-- tick marks on outer ring -->
    <g stroke="#f9a8d4" stroke-width="1.5" opacity="0.6">
      <path d="M0,-238 V-224 M0,238 V224 M-238,0 H-224 M238,0 H224"/>
      <path d="M-168,-168 L-158,-158 M168,-168 L158,-158 M-168,168 L-158,158 M168,168 L158,158"/>
    </g>

    <!-- bright core -->
    <circle r="46" fill="#eafcff" opacity="0.95" filter="url(#softBlur)"/>
    <circle r="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <circle r="30" fill="#bff4ff" opacity="0.5"/>

    <!-- 8 OS-concept badges evenly around the ring (r=230) -->
    <g transform="translate(0,-230)"><use href="#badge"/><use href="#icon-gear"/></g>
    <g transform="translate(162.6,-162.6)"><use href="#badge"/><use href="#icon-cpu"/></g>
    <g transform="translate(230,0)"><use href="#badge"/><use href="#icon-grid"/></g>
    <g transform="translate(162.6,162.6)"><use href="#badge"/><use href="#icon-lock"/></g>
    <g transform="translate(0,230)"><use href="#badge"/><use href="#icon-disk"/></g>
    <g transform="translate(-162.6,162.6)"><use href="#badge"/><use href="#icon-terminal"/></g>
    <g transform="translate(-230,0)"><use href="#badge"/><use href="#icon-layers"/></g>
    <g transform="translate(-162.6,-162.6)"><use href="#badge"/><use href="#icon-clock"/></g>
  </g>

  <!-- wireframe kernel motif above the ring -->
  <g transform="translate(960,60)" stroke="#bff4ff" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M0,-30 L38,-12 L38,22 L0,40 L-38,22 L-38,-12 Z"/>
    <path d="M0,-30 L0,40 M-38,-12 L38,22 M38,-12 L-38,22"/>
    <circle cx="0" cy="-30" r="3" fill="#bff4ff" stroke="none"/>
    <circle cx="38" cy="-12" r="3" fill="#bff4ff" stroke="none"/>
    <circle cx="38" cy="22" r="3" fill="#bff4ff" stroke="none"/>
    <circle cx="0" cy="40" r="3" fill="#bff4ff" stroke="none"/>
    <circle cx="-38" cy="22" r="3" fill="#bff4ff" stroke="none"/>
    <circle cx="-38" cy="-12" r="3" fill="#bff4ff" stroke="none"/>
  </g>
  <path d="M960,100 V115" stroke="#bff4ff" stroke-width="1.6" opacity="0.7"/>

  <!-- drifting particles -->
  <g fill="#a5f3fc"><circle cx="700" cy="560" r="2.6" opacity="0.7"/><circle cx="1250" cy="560" r="2.4" opacity="0.6"/></g>
  <g fill="#fbbf24"><circle cx="820" cy="140" r="2.4" opacity="0.6"/><circle cx="1130" cy="150" r="2.2" opacity="0.55"/></g>

  <!-- bottom circuit strip -->
  <rect x="0" y="602" width="1920" height="68" fill="#081a38"/>
  <rect x="0" y="602" width="1920" height="2.5" fill="#67e8f9" opacity="0.5"/>
  <g stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.3" fill="none">
    <path d="M50 636 H300 V620 H480"/>
    <path d="M1870 636 H1620 V620 H1440"/>
  </g>
  <g fill="#fbbf24" opacity="0.8"><circle cx="300" cy="620" r="2.2"/><circle cx="1620" cy="620" r="2.2"/></g>
</svg>
